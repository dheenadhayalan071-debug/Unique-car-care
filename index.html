    <script>
        // ─── Navbar Scroll Effect ───
        const navbar = document.getElementById('navbar');
        window.addEventListener('scroll', () => {
            if (window.scrollY > 60) {
                navbar.classList.add('scrolled');
            } else {
                navbar.classList.remove('scrolled');
            }
        });

        // ─── Hamburger Menu ───
        const hamburger = document.getElementById('hamburger');
        const mobileMenu = document.getElementById('mobileMenu');

        hamburger.addEventListener('click', () => {
            hamburger.classList.toggle('active');
            mobileMenu.classList.toggle('active');
            document.body.style.overflow = mobileMenu.classList.contains('active') ? 'hidden' : '';
        });

        document.querySelectorAll('.mobile-link').forEach(link => {
            link.addEventListener('click', () => {
                hamburger.classList.remove('active');
                mobileMenu.classList.remove('active');
                document.body.style.overflow = '';
            });
        });

        // ─── Scroll Reveal (Intersection Observer) ───
        const revealEls = document.querySelectorAll('.reveal, .stagger-reveal');

        const revealObserver = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('visible');
                }
            });
        }, {
            threshold: 0.15,
            rootMargin: '0px 0px -40px 0px'
        });

        revealEls.forEach(el => revealObserver.observe(el));

        // ─── Stats Counter Animation ───
        let statsCounted = false;

        function animateCounters() {
            if (statsCounted) return;
            statsCounted = true;

            document.querySelectorAll('.stat-number[data-target]').forEach(counter => {
                const target = parseInt(counter.getAttribute('data-target'));
                const suffix = counter.getAttribute('data-suffix') || '';
                const duration = 2000;
                const startTime = performance.now();

                function updateCounter(currentTime) {
                    const elapsed = currentTime - startTime;
                    const progress = Math.min(elapsed / duration, 1);
                    // Ease out cubic
                    const eased = 1 - Math.pow(1 - progress, 3);
                    const current = Math.round(eased * target);
                    counter.textContent = current + suffix;

                    if (progress < 1) {
                        requestAnimationFrame(updateCounter);
                    }
                }

                requestAnimationFrame(updateCounter);
            });
        }

        const statsObserver = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    animateCounters();
                }
            });
        }, { threshold: 0.3 });

        const statsCard = document.getElementById('statsCard');
        if (statsCard) statsObserver.observe(statsCard);

        // ─── Particles ───
        const particlesContainer = document.getElementById('particles');
        const colors = ['#e94560', '#7c4dff', '#448aff'];

        for (let i = 0; i < 25; i++) {
            const particle = document.createElement('div');
            particle.classList.add('particle');
            const color = colors[Math.floor(Math.random() * colors.length)];
            const size = 2 + Math.random() * 2;
            const left = Math.random() * 100;
            const delay = Math.random() * 12;
            const duration = 8 + Math.random() * 12;

            particle.style.cssText = `
                background: ${color};
                width: ${size}px;
                height: ${size}px;
                left: ${left}%;
                animation-duration: ${duration}s;
                animation-delay: ${delay}s;
            `;
            particlesContainer.appendChild(particle);
        }

        // ─── Form Demo Submit ───
        document.getElementById('enquiryForm').addEventListener('submit', function(e) {
            e.preventDefault();
            alert('DEMO: Form submitted successfully! ✅\n\nIn the live version, this will send the enquiry to your WhatsApp or email.');
            this.reset();
        });
    </script>
